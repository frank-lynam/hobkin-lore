<!doctype html>
<!-- An imitation of a PeopleSoft sign-on page's structure, for checking examples. Not PeopleSoft's markup. -->
<html><head><title>Oracle PeopleSoft Sign-in</title></head><body>
<form method="get" action="/psp/ps/EMPLOYEE/HRMS/h/">
  <label for="userid">User ID</label> <input id="userid" name="userid">
  <label for="pwd">Password</label> <input id="pwd" name="pwd" type="password">
  <input type="hidden" name="tab" value="DEFAULT">
  <input type="submit" name="Submit" value="Sign In">
</form></body></html>
